# Work Plan Document Type Package
# Version 1.0.0 - ADR-071 Binder Management & Presentation

doc_type_id: work_plan
display_name: "Work Plan"
version: "1.0.0"
description: >
  Final binder artifact with executive summary, grouped work items,
  decision log, and dependency context. Read-only deliverable intended
  for review and handoff. Per ADR-071.

# Classification
authority_level: descriptive
creation_mode: mechanical
production_mode: assemble
scope: project
cardinality: single
display_prefix: PLAN

# Dependencies
required_inputs:
  - work_binder
optional_inputs:
  - synthesis_delta
creates_children: []
parent_doc_type: null

# Schema reference
schema_ref: "schema:work_plan:1.0.0"

# Packaged artifacts
artifacts:
  task_prompt: null
  qa_prompt: null
  pgc_context: null
  questions_prompt: null
  schema: "schemas/schema.json"

# Tests
tests:
  fixtures: []
  golden_traces: []

# Gating rules
gating_rules:
  lifecycle_states: []
  design_status: []
  acceptance_required: false
  accepted_by: []

# Information Architecture (ADR-054)
information_architecture:
  version: 1

  sections:
    - id: executive_summary
      label: Executive Summary
      binds:
        - path: executive_summary.project_name
          render_as: paragraph
        - path: executive_summary.objective
          render_as: paragraph
        - path: executive_summary.scope_summary
          render_as: paragraph
        - path: executive_summary.key_constraints
          render_as: list
        - path: executive_summary.component_count
          render_as: paragraph
        - path: executive_summary.work_package_count
          render_as: paragraph
        - path: executive_summary.work_statement_count
          render_as: paragraph

    - id: documents
      label: Project Documents
      binds:
        - path: referenced_documents
          render_as: grouped-documents
          group_by: group

    - id: decisions
      label: Decision Log
      binds:
        - path: decision_log
          render_as: decision-log

    - id: dependencies
      label: Dependencies
      binds:
        - path: dependency_summary
          render_as: dependency-summary

# UI configuration
ui:
  icon: clipboard-check
  category: deliverable
  display_order: 70
