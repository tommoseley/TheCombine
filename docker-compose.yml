# The Combine - Docker Compose for Development
# Connects to AWS RDS dev database (configured in .env)
services:
  app:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=text
      - ALLOWED_ORIGINS=http://localhost:8000,http://localhost:3000
    # Override entrypoint for dev: add --reload
    command: ["--reload"]
    volumes:
      - ./app:/app/app
      - ./combine-config:/app/combine-config
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
      - ./spa:/app/spa
      - ./.git:/app/.git
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
